name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore OtusCSharp.sln

      - name: Build
        run: dotnet build OtusCSharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OtusCSharp.sln --configuration Release --no-build --verbosity normal

      - name: Test & Collect Coverage
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.11  # Используйте актуальное имя и версию
        with:
          reports: './coverage/**/coverage.cobertura.xml'      # Обратите внимание: параметр называется reports, а не signals
          targetdir: 'coveragereport'
          reporttypes: 'MarkdownSummary;Badges'

      - name: Write to Job Summary
        run: cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY
